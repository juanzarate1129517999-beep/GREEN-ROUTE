# Consulta el motor publicado en Render cada pocos minutos para que el plan gratuito no lo apague por inactividad.
name: Mantener el motor encendido

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar /api/estado
        run: >
          curl -fsS --max-time 120 --retry 3 --retry-delay 10
          -o /dev/null -w "HTTP %{http_code} en %{time_total} s\n"
          https://green-route-7atf.onrender.com/api/estado
